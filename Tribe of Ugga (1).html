<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tribe of Ugga</title>
  <style>
    :root {
      --bg: #d5c8aa;
      --panel: rgba(53, 42, 30, 0.8);
      --panel2: rgba(18, 17, 15, 0.7);
      --ink: #f8ebd8;
      --line: rgba(255,255,255,0.18);
      --gold: #e6bd5f;
      --emerald: #67b16b;
      --stone: #8a7e6d;
      --water: #5aaad4;
      --danger: #cf5d4c;
      --notice: #f7d57a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #b8b09c;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--ink);
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #cecfcc 0%, #c0b5a6 100%);
    }
    #game-wrap {
      position: relative;
      width: min(100vw, 1400px);
      height: min(100vh, 860px);
      border: 3px solid rgba(44, 35, 27, 0.7);
      border-radius: 10px;
      background: linear-gradient(180deg, #96d5ff 0%, #d9f0ff 30%, #a5d36c 31%, #6e9a3d 100%);
      overflow: hidden;
      box-shadow: 0 22px 52px rgba(0,0,0,.25);
    }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 8px 10px;
      background: rgba(28, 20, 18, 0.62);
      border: 2px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.2;
      z-index: 20;
      backdrop-filter: blur(4px);
    }
    .hud-chip {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      white-space: nowrap;
    }
    .hud-chip strong {
      color: var(--gold);
      font-weight: 800;
    }
    #notice {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 18px;
      min-width: min(70vw, 380px);
      max-width: 85vw;
      background: rgba(18, 18, 18, 0.72);
      border: 2px solid var(--notice);
      border-radius: 8px;
      padding: 10px 16px;
      color: #fff4d3;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
      z-index: 25;
      box-shadow: 0 8px 18px rgba(0,0,0,.28);
    }
    #notice.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }
    #mini {
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 180px;
      height: 120px;
      border: 2px solid rgba(255,255,255,.25);
      background: rgba(17, 20, 24, 0.5);
      border-radius: 8px;
      overflow: hidden;
      z-index: 10;
    }
    #mini canvas {
      width: 100%;
      height: 100%;
    }
    @media (max-width: 720px) {
      #hud { font-size: 11px; }
      #mini { width: 130px; height: 90px; }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div id="hud">
      <div class="hud-chip"><strong>Age:</strong> <span id="age">Tribe</span></div>
      <div class="hud-chip"><strong>Food:</strong> <span id="food">0</span></div>
      <div class="hud-chip"><strong>Wood:</strong> <span id="wood">0</span></div>
      <div class="hud-chip"><strong>Stone:</strong> <span id="stone">0</span></div>
      <div class="hud-chip"><strong>Gold:</strong> <span id="gold">0</span></div>
      <div class="hud-chip"><strong>Kingdoms:</strong> <span id="kingdoms">0</span></div>
      <div class="hud-chip"><strong>Weapon:</strong> <span id="weapon">Spear</span></div>
    </div>
    <canvas id="game"></canvas>
    <div id="mini"><canvas id="minimap"></canvas></div>
    <div id="notice">Tribe camp established</div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('minimap');
    const miniCtx = miniCanvas.getContext('2d');
    const noticeEl = document.getElementById('notice');

    const hud = {
      age: document.getElementById('age'),
      food: document.getElementById('food'),
      wood: document.getElementById('wood'),
      stone: document.getElementById('stone'),
      gold: document.getElementById('gold'),
      kingdoms: document.getElementById('kingdoms'),
      weapon: document.getElementById('weapon')
    };

    const state = {
      mapWidth: 2200,
      mapHeight: 1700,
      oceanY: 1360,
      time: 0,
      camera: { x: 0, y: 0 },
      keys: {},
      buildings: [],
      units: [],
      particles: [],
      kingdoms: [],
      player: {
        x: 1400,
        y: 860,
        radius: 18,
        speed: 180,
        ox: 0,
        oy: 0,
        age: 'Tribe',
        resources: { food: 40, wood: 35, stone: 25, gold: 10 },
        kingdomCount: 1,
        weapon: 'Spear',
        health: 100,
        stamina: 100,
        attackRate: 0.6,
      },
      noticeTimer: 0,
      lastTime: 0,
      tick: 0,
      weather: 'clear',
    };

    function showNotice(msg) {
      noticeEl.textContent = msg;
      noticeEl.classList.add('show');
      state.noticeTimer = 2.4;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function rectContains(x, y, rx, ry, rw, rh) {
      return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
    }

    function makeBuilding(type, x, y, w, h, owner = 'player', team = 'tribe') {
      const building = {
        type,
        x,
        y,
        w,
        h,
        owner,
        team,
        hp: type === 'castle' ? 220 : 120,
        maxHp: type === 'castle' ? 220 : 120,
        captured: owner === 'player',
      };
      state.buildings.push(building);
      return building;
    }

    function makeUnit(type, x, y, team, color) {
      const unit = {
        type,
        x,
        y,
        team,
        color,
        radius: type === 'fighter' ? 14 : 11,
        vx: rand(-20, 20),
        vy: rand(-20, 20),
        speed: type === 'fighter' ? 60 : 85,
        hp: 100,
        maxHp: 100,
        weapon: type === 'fighter' ? 'Stone spear' : 'Club',
        target: null,
      };
      state.units.push(unit);
      return unit;
    }

    function makeKingdom(x, y, name, civil, owner = 'neutral') {
      const k = {
        x,
        y,
        name,
        civil,
        owner,
        hp: 160,
        maxHp: 160,
        radius: 110,
      };
      state.kingdoms.push(k);
      return k;
    }

    function seedWorld() {
      state.buildings = [];
      state.units = [];
      state.kingdoms = [];
      state.particles = [];

      makeBuilding('tent', 1320, 860, 90, 70, 'player', 'tribe');
      makeBuilding('campfire', 1450, 930, 44, 44, 'player', 'tribe');
      makeBuilding('hunting_post', 1520, 760, 80, 44, 'player', 'tribe');
      makeBuilding('castle', 1780, 580, 150, 160, 'neutral', 'castle');

      makeKingdom(600, 700, 'Caveman Camp', 'caveman', 'neutral');
      makeKingdom(1080, 1160, 'River Village', 'tribe', 'player');
      makeKingdom(1760, 980, 'Castle Keep', 'castle', 'neutral');
      makeKingdom(580, 1320, 'Coastal Clan', 'tribe', 'neutral');
      makeKingdom(1920, 1300, 'Stone Shore', 'caveman', 'neutral');

      for (let i = 0; i < 22; i++) {
        makeUnit('fighter', rand(350, 1900), rand(330, 1500), i % 3 === 0 ? 'enemy' : 'ally', 'rgb(' + (80 + i * 3) + ', ' + (90 + i) + ', ' + (60 + i * 2) + ')');
      }

      for (let i = 0; i < 120; i++) {
        state.particles.push({
          x: rand(240, state.mapWidth - 240),
          y: rand(200, state.mapHeight - 180),
          type: i % 4 === 0 ? 'dust' : i % 3 === 0 ? 'smoke' : i % 2 === 0 ? 'spark' : 'firefly',
          vx: rand(-12, 12),
          vy: rand(-12, 12),
          r: rand(1.5, 5),
          alpha: rand(0.3, 0.9),
          life: rand(1.2, 5),
        });
      }

      showNotice('Tribe camp established');
    }

    function updateHUD() {
      hud.age.textContent = state.player.age;
      hud.food.textContent = Math.floor(state.player.resources.food);
      hud.wood.textContent = Math.floor(state.player.resources.wood);
      hud.stone.textContent = Math.floor(state.player.resources.stone);
      hud.gold.textContent = Math.floor(state.player.resources.gold);
      hud.kingdoms.textContent = state.player.kingdomCount;
      hud.weapon.textContent = state.player.weapon;
    }

    function updateParticles() {
      for (const p of state.particles) {
        const drift = p.type === 'dust' ? 0.5 : p.type === 'smoke' ? 0.2 : p.type === 'firefly' ? 0.7 : 1.6;
        p.x += p.vx * drift;
        p.y += p.vy * drift;
        p.life -= 0.015;
        if (p.type === 'smoke') {
          p.vy -= 0.02;
        }
        if (p.type === 'spark') {
          p.vy -= 0.02;
        }
        if (p.type === 'firefly') {
          p.vx += Math.sin((state.time + p.x) * 0.02) * 0.08;
        }
        if (p.x < 0 || p.x > state.mapWidth || p.y < 0 || p.y > state.mapHeight || p.life <= 0) {
          p.x = rand(200, state.mapWidth - 200);
          p.y = rand(80, state.mapHeight - 80);
          p.life = rand(1.2, 5);
        }
      }
    }

    function updatePlayer() {
      const dx = (state.keys.ArrowRight || state.keys.d ? 1 : 0) - (state.keys.ArrowLeft || state.keys.a ? 1 : 0);
      const dy = (state.keys.ArrowDown || state.keys.s ? 1 : 0) - (state.keys.ArrowUp || state.keys.w ? 1 : 0);

      const len = Math.hypot(dx, dy) || 1;
      const moveX = (dx / len) * state.player.speed;
      const moveY = (dy / len) * state.player.speed;

      state.player.x = clamp(state.player.x + moveX * (1 / 60), 40, state.mapWidth - 40);
      state.player.y = clamp(state.player.y + moveY * (1 / 60), 40, state.mapHeight - 40);

      if (state.player.x > 1850 && state.player.y > 1260) {
        state.weather = 'rain';
      } else if (state.player.y < 600) {
        state.weather = 'sunset';
      } else {
        state.weather = 'clear';
      }

      if (state.player.y > state.oceanY - 100) {
        state.player.y = clamp(state.player.y, 40, state.oceanY - 120);
      }

      if (state.keys[' '] && state.tick % 25 === 0) {
        for (const kingdom of state.kingdoms) {
          const dist = Math.hypot(state.player.x - kingdom.x, state.player.y - kingdom.y);
          if (dist < kingdom.radius + 40 && kingdom.owner !== 'player') {
            kingdom.owner = 'player';
            state.player.kingdomCount += 1;
            state.player.resources.food += 15;
            state.player.resources.wood += 12;
            state.player.resources.stone += 10;
            showNotice('Kingdom captured: ' + kingdom.name);
            if (state.player.weapon === 'Spear') {
              state.player.weapon = 'Iron spear';
            } else if (state.player.weapon === 'Iron spear') {
              state.player.weapon = 'Musket';
              state.player.age = 'Castle';
            }
          }
        }
      }

      if (state.keys.e && state.tick % 20 === 0) {
        const struct = state.buildings.find(b => Math.hypot(state.player.x - (b.x + b.w/2), state.player.y - (b.y + b.h/2)) < 80);
        if (struct) {
          if (struct.type === 'campfire') {
            showNotice('Campfire lit. Firelight and smoke spread.');
            state.player.resources.food += 2;
          } else if (struct.type === 'tent') {
            showNotice('Tent rest: morale restored.');
            state.player.health = Math.min(100, state.player.health + 20);
          } else if (struct.type === 'castle') {
            state.player.age = 'Castle';
            state.player.weapon = 'Old gun';
            showNotice('Castle age unlocked: muskets and old guns available.');
          }
        }
      }
    }

    function updateUnits() {
      for (const unit of state.units) {
        const target = state.kingdoms.find(k => k.owner !== unit.team && Math.hypot(unit.x - k.x, unit.y - k.y) < 180) || state.buildings.find(b => b.owner !== unit.team && Math.hypot(unit.x - (b.x + b.w / 2), unit.y - (b.y + b.h / 2)) < 100);

        if (target) {
          const tx = (target.x || target.x + target.w / 2);
          const ty = (target.y || target.y + target.h / 2);
          const angle = Math.atan2(ty - unit.y, tx - unit.x);
          unit.x += Math.cos(angle) * unit.speed * 0.016;
          unit.y += Math.sin(angle) * unit.speed * 0.016;
        } else {
          unit.x += unit.vx * 0.016;
          unit.y += unit.vy * 0.016;
        }

        if (unit.x < 50 || unit.x > state.mapWidth - 50) unit.vx *= -1;
        if (unit.y < 50 || unit.y > state.mapHeight - 50) unit.vy *= -1;
      }
    }

    function updateCamera() {
      const w = canvas.width;
      const h = canvas.height;
      state.camera.x = clamp(state.player.x - w / 2, 0, state.mapWidth - w);
      state.camera.y = clamp(state.player.y - h / 2, 0, state.mapHeight - h);
    }

    function drawTerrain() {
      const left = state.camera.x;
      const top = state.camera.y;
      const w = canvas.width;
      const h = canvas.height;

      ctx.fillStyle = '#7db355';
      ctx.fillRect(0, 0, w, h);

      const patternScale = 28;
      for (let y = -patternScale; y < h + patternScale; y += patternScale) {
        for (let x = -patternScale; x < w + patternScale; x += patternScale) {
          const worldX = x + left;
          const worldY = y + top;
          const gravel = ((Math.sin(worldX * 0.05) + Math.cos(worldY * 0.04)) * 0.5 + 0.5) > 0.6;
          ctx.fillStyle = gravel ? '#c2bb80' : '#8cc35d';
          ctx.fillRect(x, y, patternScale + 2, patternScale + 2);
        }
      }

      const shoreTop = state.oceanY - 100;
      const oceanRectY = shoreTop + 60;
      ctx.fillStyle = '#6bb8db';
      ctx.fillRect(0, oceanRectY - top, w, h - (oceanRectY - top));

      for (let i = 0; i < 18; i++) {
        const x = (i * 130 + (state.time * 20)) % (w + 160) - 80;
        const y = oceanRectY - top + 20 + (i % 4) * 38 + Math.sin(i + state.time * 0.9) * 16;
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(x, y, 100, 6);
      }

      for (let i = 0; i < 220; i++) {
        const x = ((i * 63) % (state.mapWidth + 100)) - 40;
        const y = ((i * 89) % (state.mapHeight + 100)) - 40;
        const sx = x - left;
        const sy = y - top;
        if (sx < -20 || sx > w + 20 || sy < -20 || sy > h + 20) continue;
        const noise = ((i * 17) % 10) / 10;
        ctx.fillStyle = noise < 0.4 ? '#4b7f2d' : '#6d8d3d';
        ctx.fillRect(sx, sy, 10, 10);
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const x = p.x - state.camera.x;
        const y = p.y - state.camera.y;
        if (x < -20 || x > canvas.width + 20 || y < -20 || y > canvas.height + 20) continue;

        if (p.type === 'dust') {
          ctx.fillStyle = `rgba(118, 103, 79, ${p.alpha})`;
          ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
        } else if (p.type === 'smoke') {
          ctx.fillStyle = `rgba(128, 122, 112, ${p.alpha * 0.6})`;
          ctx.beginPath(); ctx.arc(x, y, p.r * 3, 0, Math.PI * 2); ctx.fill();
        } else if (p.type === 'spark') {
          ctx.fillStyle = `rgba(255, 183, 70, ${p.alpha})`;
          ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
        } else if (p.type === 'firefly') {
          ctx.fillStyle = `rgba(255, 255, 180, ${p.alpha * 0.9})`;
          ctx.beginPath(); ctx.arc(x, y, p.r + 1, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function drawBuilding(building) {
      const x = building.x - state.camera.x;
      const y = building.y - state.camera.y;
      if (x < -200 || x > canvas.width + 200 || y < -200 || y > canvas.height + 200) return;

      if (building.type === 'tent') {
        ctx.fillStyle = '#8b5a3d';
        ctx.fillRect(x, y, building.w, building.h);
        ctx.fillStyle = '#d7b98a';
        ctx.fillRect(x + 12, y + 10, building.w - 24, building.h - 18);
        ctx.fillStyle = '#8e6545';
        ctx.fillRect(x + 12, y + 15, 18, building.h - 30);
        ctx.fillRect(x + building.w - 30, y + 15, 18, building.h - 30);
      } else if (building.type === 'campfire') {
        ctx.fillStyle = '#6b5141';
        ctx.fillRect(x, y, building.w, building.h);
        ctx.fillStyle = '#ff8e3a';
        ctx.beginPath(); ctx.arc(x + building.w / 2, y + building.h / 2, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255, 134, 45, 0.2)';
        ctx.beginPath(); ctx.arc(x + building.w / 2, y + building.h / 2, 38, 0, Math.PI * 2); ctx.fill();
      } else if (building.type === 'hunting_post') {
        ctx.fillStyle = '#7c5a45';
        ctx.fillRect(x, y, building.w, building.h);
        ctx.fillStyle = '#b48d60';
        ctx.fillRect(x + 10, y + 8, building.w - 20, building.h - 16);
      } else if (building.type === 'castle') {
        ctx.fillStyle = '#7f8578';
        ctx.fillRect(x, y, building.w, building.h);
        ctx.fillStyle = '#8a8f76';
        for (let row = 0; row < 3; row++) {
          for (let col = 0; col < 4; col++) {
            ctx.fillRect(x + 14 + col * 30, y + 18 + row * 34, 18, 18);
          }
        }
      }
    }

    function drawKingdom(k) {
      const x = k.x - state.camera.x;
      const y = k.y - state.camera.y;
      if (x < -200 || x > canvas.width + 200 || y < -200 || y > canvas.height + 200) return;

      const color = k.owner === 'player' ? '#75d084' : k.owner === 'neutral' ? '#d1b875' : '#d88a6d';
      ctx.beginPath(); ctx.arc(x, y, 30, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, k.radius, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#f4e6ce';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(k.name, x, y - 46);
    }

    function drawUnits() {
      for (const unit of state.units) {
        const x = unit.x - state.camera.x;
        const y = unit.y - state.camera.y;
        if (x < -30 || x > canvas.width + 30 || y < -30 || y > canvas.height + 30) continue;
        ctx.fillStyle = unit.team === 'enemy' ? '#c85353' : '#679bff';
        ctx.beginPath(); ctx.arc(x, y, unit.radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#101010';
        ctx.fillRect(x - 14, y - 20, 28, 4);
        ctx.fillStyle = '#56d37d';
        ctx.fillRect(x - 14, y - 20, 28 * (unit.hp / unit.maxHp), 4);
      }
    }

    function drawPlayer() {
      const x = state.player.x - state.camera.x;
      const y = state.player.y - state.camera.y;

      ctx.fillStyle = '#d5a06f';
      ctx.beginPath(); ctx.arc(x, y, state.player.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#604f38';
      ctx.fillRect(x - 4, y + 18, 8, 18);
      ctx.strokeStyle = '#eae1d0';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 18, y + 8); ctx.stroke();

      ctx.fillStyle = '#b77f4b';
      ctx.fillRect(x - 14, y + 3, 28, 14);
    }

    function drawWorld() {
      drawTerrain();
      drawParticles();
      for (const building of state.buildings) drawBuilding(building);
      for (const kingdom of state.kingdoms) drawKingdom(kingdom);
      drawUnits();
      drawPlayer();
    }

    function drawMiniMap() {
      const w = miniCanvas.width;
      const h = miniCanvas.height;
      miniCtx.clearRect(0, 0, w, h);
      miniCtx.fillStyle = '#1a2a26';
      miniCtx.fillRect(0, 0, w, h);
      miniCtx.fillStyle = '#5cbfd7';
      miniCtx.fillRect(0, h * 0.72, w, h * 0.28);

      const sx = w / state.mapWidth;
      const sy = h / state.mapHeight;
      for (const kingdom of state.kingdoms) {
        miniCtx.fillStyle = kingdom.owner === 'player' ? '#7cd87d' : kingdom.owner === 'neutral' ? '#e0cc75' : '#dc775c';
        miniCtx.beginPath(); miniCtx.arc(kingdom.x * sx, kingdom.y * sy, 5, 0, Math.PI * 2); miniCtx.fill();
      }

      miniCtx.fillStyle = '#f4dfae';
      miniCtx.beginPath(); miniCtx.arc(state.player.x * sx, state.player.y * sy, 4, 0, Math.PI * 2); miniCtx.fill();
    }

    function loop(ts) {
      const dt = (ts - state.lastTime) / 1000 || 0.016;
      state.lastTime = ts;
      state.time += dt;
      state.tick++;

      updatePlayer();
      updateUnits();
      updateParticles();
      updateCamera();
      updateHUD();

      if (state.noticeTimer > 0) {
        state.noticeTimer -= dt;
        if (state.noticeTimer <= 0) {
          noticeEl.classList.remove('show');
        }
      }

      drawWorld();
      drawMiniMap();
      requestAnimationFrame(loop);
    }

    function resizeCanvas() {
      const wrap = document.getElementById('game-wrap');
      const rect = wrap.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * devicePixelRatio);
      canvas.height = Math.floor(rect.height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      miniCanvas.width = 180 * devicePixelRatio;
      miniCanvas.height = 120 * devicePixelRatio;
      miniCtx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);

      canvas.width = Math.floor(rect.width * devicePixelRatio);
      canvas.height = Math.floor(rect.height * devicePixelRatio);
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    window.addEventListener('resize', resizeCanvas);

    document.addEventListener('keydown', (e) => {
      state.keys[e.key] = true;
      state.keys[e.key.toLowerCase()] = true;
      state.keys[e.code] = true;
      if (e.key === ' ') e.preventDefault();
    });

    document.addEventListener('keyup', (e) => {
      state.keys[e.key] = false;
      state.keys[e.key.toLowerCase()] = false;
      state.keys[e.code] = false;
    });

    resizeCanvas();
    seedWorld();
    updateHUD();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
